* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif; color: var(--fg); background: var(--bg); }

p { margin: 0.4rem 0; }
.lead { font-weight: 600; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.9rem; margin: 0.5rem 0; }
dl.facts dt { color: var(--muted); text-align: right; }

.value { white-space: pre-wrap; overflow-wrap: anywhere; }
.none { color: var(--muted); }

.omitted { font-size: 0.85em; color: var(--warn); font-style: italic; }
ol.argv { list-style: none; padding: 0; margin: 0.3rem 0; display: flex; flex-wrap: wrap; gap: 0.3rem; }
ol.argv li { font-family: ui-monospace, Menlo, monospace; background: var(--chip); border: 1px solid var(--line); border-radius: 4px; padding: 0.05rem 0.35rem; max-width: 100%; }
ol.chain { list-style: none; padding: 0; margin: 0.3rem 0; }
ol.chain li { border-left: 2px solid var(--line); margin: 0.15rem 0; padding-left: 0.5rem; }
ol.chain summary { cursor: pointer; overflow-wrap: anywhere; }
ol.chain .name { font-weight: 600; }
ol.chain .sig, ol.chain .who { color: var(--muted); margin-left: 0.4rem; }

li.ok .badge { color: var(--ok); border-color: var(--ok); }
li.caller { border-left-color: var(--accent); }
ol.chain dl.facts { font-size: 0.9rem; margin-left: 0.4rem; }

.actions.pair { grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.actions.pair > .danger { grid-column: 1 / -1; }
button { font: inherit; font-weight: 600; padding: 0.65rem 1.2rem; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { background: transparent; border-color: var(--warn); color: var(--warn); }
button:disabled { opacity: 0.45; cursor: default; }
#status { min-height: 1.5rem; font-weight: 600; }
#status.ok { color: var(--ok); }
#status.bad { color: var(--warn); }
.note { display: block; font-size: 0.85rem; color: var(--muted); }
.product { margin: 0.25rem 0 0; font-size: 0.85rem; font-weight: 600; color: var(--muted); }

  const MESSAGES = {

    },

      intro: "pam-passkey の認証の承認と passkey の登録を行うページです。Mac の pam-passkey が表示・送信する URL から開いてください。",
      project: "pam-passkey について",

      touch_failed: "Mac に Touch ID を求められませんでした ({0})。",
      waiting_passkey: "passkey の操作を待っています…",

      rejecting: "拒否しました。Mac の判定を待っています…",
      already_answered: "この要求には既に回答があります。Mac の判定を待っています…",
      passed: "承認されました。Mac が passkey を受け入れました。",
      failed: "承認されませんでした。Mac が回答を受け入れなかったか、要求が終了しました。",

      register_title: "passkey の登録",
      register_lead: "自分で始めた操作の場合だけ登録してください。",
      register_host: "ホスト名",
      register_user: "対象ユーザ",
      ids: "(uid {0} / gid {1})",
      register_label: "登録ラベル",
      register_code: "登録コード",
      register_code_check: "pam-passkey add を実行した端末 (と本人確認のダイアログ) に出ているコードと一致することを確かめてください。",
      register_url: "登録URL",
      created: "作成日時",
      register_expires: "登録期限",
      register_left: "残り時間",
      register: "passkey を登録",
      registered: "Mac の pam-passkey add に passkey を送りました。結果は add を実行した端末で確かめてください。",
      rejected_register: "拒否しました。Mac の pam-passkey add は登録せずに終わります。",
      already_answered_register: "この登録には既に回答があります。結果は add を実行した端末で確かめてください。",
    },
  };
  const language = String(navigator.language || "en").toLowerCase().startsWith("ja") ? "ja" : "en";
  document.documentElement.lang = language;
  const t = (key, ...args) =>
    (MESSAGES[language][key] ?? MESSAGES.en[key]).replace(/\{(\d)\}/g, (_, index) => String(args[Number(index)]));

  // The template of `key` with each {n} replaced by the node `values[n]`.
  function sentence(key, ...values) {
    const template = MESSAGES[language][key] ?? MESSAGES.en[key];
    return template.split(/\{(\d)\}/).map((part, index) => (index % 2 ? values[Number(part)] : part));
  }

  const app = document.getElementById("app");

  function element(tag, className, ...children) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    for (const child of children) node.append(child);
    return node;
  }

  // Shown values come from the request, which anyone holding the URL could have written:
  // control characters (Cc), the line and paragraph separators, format characters (Cf: bidi
  // controls, zero-width characters, tag characters, …) and the Hangul fillers, which look like
  // spaces, are made visible, and shortened values say so. The same set as pam-passkey's escape
  // (DR-0004).
  const HIDDEN = /[\p{Cc}\p{Cf}\u2028\u2029\u115f\u1160\u3164\uffa0]/u;
  function shown(value, limit = 160) {
    const span = element("span", "value");
    if (value === null || value === undefined) {
      span.classList.add("none");
      span.textContent = "—";
      return span;
    }
    const points = Array.from(String(value));
    const write = (part) => {
      let run = "";
      for (const point of part) {
        if (HIDDEN.test(point)) {
          if (run) span.append(run);
          run = "";
          span.append(element("span", "esc", "\\u{" + point.codePointAt(0).toString(16).padStart(4, "0") + "}"));
        } else {
          run += point;
        }
      }
      if (run) span.append(run);
    };
    if (points.length <= limit) {
      write(points);
    } else {
      const head = Math.ceil(limit / 2);
      const tail = Math.floor(limit / 2);
      write(points.slice(0, head));
      span.append(element("span", "omitted", " … " + t("omitted", points.length - head - tail) + " … "));
      write(points.slice(points.length - tail));
    }
    return span;
  }

  // A value for the names the passkey is stored under (WebAuthn user.name / displayName), which
  // the password manager and the passkey chooser show outside this page: the hidden characters
  // shown() marks are spelled out the same way (\u{202e}), so the stored name cannot reorder or
  // hide its text.
  function stored(value) {
    return Array.from(String(value), (point) =>
      HIDDEN.test(point) ? "\\u{" + point.codePointAt(0).toString(16).padStart(4, "0") + "}" : point,
    ).join("");
  }

  function facts(rows) {
    const list = element("dl", "facts");
    for (const [label, value] of rows) list.append(element("dt", null, label), element("dd", null, value));
    return list;
  }

  function argvList(argv) {
    if (!Array.isArray(argv)) return shown(null);
    return element("ol", "argv", ...argv.map((arg) => element("li", null, shown(arg, 200))));
  }

  // A time as this device's local time with its offset from UTC, to the second
  // (2026-11-15T08:24:02+09:00), the same in every language.
  function localTime(text) {
    const date = new Date(String(text));
    if (Number.isNaN(date.getTime())) return shown(text);
    const two = (number) => String(number).padStart(2, "0");
    const offset = -date.getTimezoneOffset();
    const sign = offset < 0 ? "-" : "+";
    const iso =
      `${date.getFullYear()}-${two(date.getMonth() + 1)}-${two(date.getDate())}` +
      `T${two(date.getHours())}:${two(date.getMinutes())}:${two(date.getSeconds())}` +
      `${sign}${two(Math.floor(Math.abs(offset) / 60))}:${two(Math.abs(offset) % 60)}`;
    return element("span", "time", shown(iso));
  }

  function bytesToBase64url(buffer) {
    let binary = "";
    for (const byte of new Uint8Array(buffer)) binary += String.fromCharCode(byte);
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function base64urlToBytes(text) {
    if (typeof text !== "string" || !/^[A-Za-z0-9_-]*$/.test(text) || text.length % 4 === 1) {
      throw new Error("not base64url");
    }
    const padded = text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4);
    return Uint8Array.from(atob(padded), (symbol) => symbol.charCodeAt(0));
  }

  function httpsUrl(text) {
    const url = new URL(String(text));
    if (url.protocol !== "https:") throw new Error("not https");
    return url;
  }

  // The fragment after the optional mark touch-id: is `r=<presigned GET, percent-encoded>&k=<key>`
  // with exactly these two names (exchange-format 承認 URL と登録 URL の fragment).
  function readLink(fragment) {
    const local = fragment.startsWith("touch-id:");
    const rest = local ? fragment.slice("touch-id:".length) : fragment;
    const values = new Map();
    for (const pair of rest.split("&")) {
      const at = pair.indexOf("=");
      const name = at < 0 ? pair : pair.slice(0, at);
      if (at < 0 || (name !== "r" && name !== "k") || values.has(name)) throw new Error("fragment");
      values.set(name, pair.slice(at + 1));
    }
    if (values.size !== 2) throw new Error("fragment");
    const key = base64urlToBytes(values.get("k"));
    if (key.length !== 32) throw new Error("key");
    return { local, url: httpsUrl(decodeURIComponent(values.get("r"))), key };
  }

  // The envelope (DR-0013, exchange-format 封筒): version 1, kind (1 approve, 2 register), a 12-byte
  // IV, then AES-256-GCM ciphertext and tag, with the first two bytes as associated data. Returns
  // the parsed plaintext, whose kind must be the envelope's; anything else throws.
  const ENVELOPE_KINDS = { 1: "approve", 2: "register" };
  async function openEnvelope(bytes, keyBytes) {
    const kind = ENVELOPE_KINDS[bytes[1]];
    if (bytes.length < 30 || bytes[0] !== 1 || kind === undefined) throw new Error("envelope");
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    const plaintext = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes.subarray(2, 14), additionalData: bytes.subarray(0, 2), tagLength: 128 },
      key,
      bytes.subarray(14),
    );
    const payload = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(plaintext));
    if (typeof payload !== "object" || payload === null || payload.kind !== kind) throw new Error("kind");
    return payload;
  }

  const fetchOptions = { cache: "no-store", credentials: "omit", redirect: "error", referrerPolicy: "no-referrer" };

  // The presigned PUT is write-once when the store signed If-None-Match into it (put_once).
  async function put(url, text) {
    const headers = {};
    const signed = (url.searchParams.get("X-Amz-SignedHeaders") || "").toLowerCase().split(";");
    if (signed.includes("if-none-match")) headers["If-None-Match"] = "*";
    return fetch(url, { ...fetchOptions, method: "PUT", headers, body: new TextEncoder().encode(text) });
  }

  // The request's conclusion (DR-0006): "pass", "fail", or null while there is none.
  async function readResult(url) {
    try {
      const response = await fetch(url, fetchOptions);
      if (response.status !== 200) return null;
      const text = (await response.text()).trim();
      return text === "pass" || text === "fail" ? text : null;
    } catch {
      return null;
    }
  }

  function statusLine() {
    const line = element("p", null);
    line.id = "status";
    line.setAttribute("role", "status");
    return line;
  }

  function setStatus(line, text, tone) {
    line.textContent = text;
    line.className = tone || "";
  }

  // The signature of each process as the PAM module verified it (pam-passkey DR-0014,
  // exchange-format `signature`). The module decides the trust mark and every element; the page
  // only maps the values to words and colors through these tables, and never judges from names.
  // A value the tables do not know is shown as it is, without a mark color.
  const SIGNATURE = {

        developer_id_notarized: "Developer ID (notarized)",

        failure: { replaced: "the executable was updated or replaced while it ran", missing: "the executable is gone", other: "other" },

        linker_signed: { yes: "yes", no: "no" },
        anchor: { apple: "Apple's own software", apple_issued: "a certificate Apple issued", other: "not Apple (self-signed or another authority)" },
        certificate_kind: { developer_id: "Developer ID", mac_app_store: "Mac App Store", development: "development (Apple Development)", other: "other" },
        notarization: { notarized: "notarized", not_notarized: "not notarized" },
        platform_binary: { yes: "yes", no: "no" },
        hardened_runtime: { yes: "yes", no: "no" },
      },
    },
    ja: {
      label: "署名",
      marks: {
        apple: "Apple のソフトウェア",
        developer_id_notarized: "Developer ID (公証済み)",
        developer_id: "Developer ID (公証なし)",
        mac_app_store: "Mac App Store",
        development: "開発用の証明書",
        apple_issued_other: "Apple が発行したその他の証明書",
        other_certificate: "Apple 以外の証明書 (自己署名など)",
        adhoc: "ad-hoc 署名 (証明書なし)",
        failed: "署名の検証に失敗",
        unsigned: "署名なし",
        not_checked: "未検証 (時間切れ)",
      },
      keys: {
        status: "署名の検証",
        failure: "失敗の理由",
        certificate: "証明書",
        linker_signed: "linker が付けた署名",
        anchor: "証明書の根",
        certificate_kind: "証明書の種類",
        notarization: "公証",
        platform_binary: "プラットフォームバイナリ",
        hardened_runtime: "hardened runtime",
        identifier: "identifier",
        team_id: "Team ID",
        signer: "署名者名",
      },
      values: {
        status: { verified: "検証に成功", failed: "検証に失敗", unsigned: "署名なし", not_checked: "未検証 (時間切れ)" },
        failure: { replaced: "走っている間に実行ファイルが更新・差し替えされた", missing: "実行ファイルが消えている", other: "その他" },
        certificate: { none: "無し (ad-hoc 署名)", present: "あり" },
        linker_signed: { yes: "はい", no: "いいえ" },
        anchor: { apple: "Apple 自身のソフトウェア", apple_issued: "Apple が発行した証明書", other: "Apple 以外 (自己署名、独自の認証局)" },
        certificate_kind: { developer_id: "Developer ID", mac_app_store: "Mac App Store", development: "開発用 (Apple Development)", other: "その他" },
        notarization: { notarized: "済み", not_notarized: "なし" },
        platform_binary: { yes: "はい", no: "いいえ" },
        hardened_runtime: { yes: "あり", no: "なし" },
      },
    },
  }[language];
  // Green for Apple's own software, red for what has no confirmed identity, no color otherwise.
  const MARK_TONES = { apple: "ok", other_certificate: "warn", adhoc: "warn", failed: "warn", unsigned: "warn", not_checked: "warn" };
  // Marks shown with the Team ID beside them; the failed mark is shown with its reason.
  const MARKS_WITH_TEAM = ["developer_id_notarized", "developer_id", "mac_app_store", "development"];
  // The elements in the order the details list them; the last three are strings as signed.
  const SIGNATURE_KEYS = ["status", "failure", "certificate", "linker_signed", "anchor", "certificate_kind",
    "notarization", "platform_binary", "hardened_runtime", "identifier", "team_id", "signer"];
  const SIGNATURE_TEXTS = ["identifier", "team_id", "signer"];

  // The words for `value` in `table`, or the value itself (made visible) when the table does not know it.
  function word(table, value, limit) {
    return Object.hasOwn(table, value) ? element("span", "value", table[value]) : shown(value, limit);
  }

  // The request's `signature` object, or null when it is missing or not an object.
  function signatureOf(process) {
    const signature = process.signature;
    return typeof signature === "object" && signature !== null && !Array.isArray(signature) ? signature : null;
  }

  // The badge and what goes beside it on a process's line.
  function markOf(signature) {
    if (!signature || typeof signature.mark !== "string") return { tone: null, nodes: [] };
    const mark = signature.mark;
    const nodes = [element("span", "badge", word(SIGNATURE.marks, mark, 40))];
    if (MARKS_WITH_TEAM.includes(mark) && typeof signature.team_id === "string") {
      nodes.push(element("span", "sig", SIGNATURE.keys.team_id + " ", shown(signature.team_id, 20)));
    }
    if (mark === "failed" && typeof signature.failure === "string") {
      nodes.push(element("span", "sig", word(SIGNATURE.values.failure, signature.failure, 40)));
    }
    return { tone: Object.hasOwn(MARK_TONES, mark) ? MARK_TONES[mark] : null, nodes };
  }

  // The elements of the signature that apply: an element the module left null does not apply to
  // this process (e.g. notarization outside Developer ID) and gets no line.
  function signatureFacts(signature) {
    if (!signature) return [[SIGNATURE.label, element("span", "value none", t("no_signature"))]];
    const rows = [];
    for (const key of SIGNATURE_KEYS) {
      const value = signature[key];
      if (typeof value !== "string") continue;
      const shownValue = SIGNATURE_TEXTS.includes(key) ? shown(value) : word(SIGNATURE.values[key], value, 80);
      rows.push([SIGNATURE.keys[key], shownValue]);
    }
    return rows;
  }

  function processName(process) {
    const source = process.path || (Array.isArray(process.argv) && process.argv[0]) || "";
    const name = String(source).split("/").pop();
    return name || "pid " + process.pid;
  }

  function chain(processes) {
    if (!Array.isArray(processes) || processes.length === 0) return element("p", "none", t("empty_chain"));
    const list = element("ol", "chain");
    // The request lists the caller first; draw it as pstree does, from launchd down.
    const ordered = processes.slice().reverse();
    ordered.forEach((entry, depth) => {
      const process = typeof entry === "object" && entry !== null ? entry : {};
      const signature = signatureOf(process);
      const mark = markOf(signature);
      const identifier = element("span", "sig", shown(signature && typeof signature.identifier === "string" ? signature.identifier : null, 60));
      const who = process.uid === 0 ? element("span", "who", "root") : element("span", "who", "uid ", shown(process.uid, 12));
      const summary = element("summary", null, element("span", "name", shown(processName(process), 60)), identifier, who, ...mark.nodes);
      const details = element("details", null, summary, facts([
        [t("pid"), shown(process.pid)],
        [t("uid"), shown(process.uid)],
        [t("cwd"), shown(process.cwd, 240)],
        [t("path"), shown(process.path, 240)],
        [t("argv"), argvList(process.argv)],
        ...signatureFacts(signature),
      ]));
      const classes = [mark.tone, depth === ordered.length - 1 ? "caller" : null].filter(Boolean).join(" ");
      const item = element("li", classes || null, details);
      item.style.marginLeft = Math.min(depth, 12) * 0.5 + "rem";
      list.append(item);
    });
    return list;
  }

  // A length of time: seconds alone under a minute, else minutes and two-digit seconds.
  function duration(seconds) {
    if (seconds < 60) return t("seconds", seconds);
    return t("minutes", Math.floor(seconds / 60), String(seconds % 60).padStart(2, "0"));
  }

  // "left / whole" (whole: from `createdAt` to `expiresAt`), updated every second.
  function countdown(createdAt, expiresAt, onExpired) {
    const whole = Number.isNaN(createdAt) ? null : Math.max(0, Math.round((expiresAt - createdAt) / 1000));
    const left = element("span", null);
    const cell = element("span", "left", left, whole === null ? "" : " / " + duration(whole));
    const tick = () => {
      const seconds = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
      left.textContent = duration(seconds);
      if (seconds === 0) {
        clearInterval(timer);
        onExpired();
      }
    };
    const timer = setInterval(tick, 1000);
    tick();
    return cell;
  }

  // `local`: opened by pam-passkey on the Mac from "Show details" (the touch-id: mark), which
  // alone offers "Approve with Touch ID" (DR-0004; the helper marks the URL only on a Mac whose
  // biometry is Touch ID).
  function approve(request, challenge, local) {
    const details = request.details;
    const assertionUrl = httpsUrl(request.assertion_put_url);
    const resultUrl = httpsUrl(request.result_get_url);
    const touchUrl = local && typeof request.touch_put_url === "string" ? httpsUrl(request.touch_put_url) : null;
    const allow = request.allow_credentials.map((id) => ({ type: "public-key", id: base64urlToBytes(id) }));
    const expiresAt = new Date(String(request.expires)).getTime();
    if (typeof details !== "object" || details === null || Number.isNaN(expiresAt)) throw new Error("request");

    const status = statusLine();
    // The two ways to approve look alike (blue, one size, side by side when the width allows);
    // rejecting is red, not filled, and takes the whole row below them.
    const approveButton = element("button", "primary", t("approve"));
    const rejectButton = element("button", "danger", t("reject"));
    const touchButton = touchUrl ? element("button", "primary", t("touch")) : null;
    // The Mac takes one request per press of "Show details" in its dialog (DR-0004), so the
    // button stays usable; it is off only while its PUT is on the way, so a press sends once.
    let touchSending = false;
    // idle → asking (passkey dialog) → sent (answer PUT, fast poll) → done.
    let state = "idle";
    const enable = (on) => {
      approveButton.disabled = !on;
      rejectButton.disabled = !on;
      if (touchButton) touchButton.disabled = !on || touchSending;
    };
    const finish = (text, tone) => {
      state = "done";
      enable(false);
      setStatus(status, text, tone);
    };

    const fastPoll = async (until) => {
      while (state === "sent") {
        const result = await readResult(resultUrl);
        if (state !== "sent") return;
        if (result) return finish(t(result === "pass" ? "passed" : "failed"), result === "pass" ? "ok" : "bad");
        if (Date.now() >= until) return finish(t("result_unknown"), "bad");
        await new Promise((resolve) => setTimeout(resolve, POLL_FAST));
      }
    };
    // Before an answer is sent, a result means the request ended some other way (Touch ID,
    // cancel, expiry); the page shows it and offers nothing more.
    const slowPoll = async () => {
      while (state === "idle" || state === "asking") {
        const result = await readResult(resultUrl);
        if (result && (state === "idle" || state === "asking")) {
          return finish(t(result === "pass" ? "ended_pass" : "ended_fail"), result === "pass" ? "ok" : "bad");
        }
        await new Promise((resolve) => setTimeout(resolve, POLL_SLOW));
      }
    };

    const answer = async (text, waiting) => {
      setStatus(status, t("sending"));
      let response;
      try {
        response = await put(assertionUrl, text);
      } catch (error) {
        state = "idle";
        enable(Date.now() < expiresAt);
        return setStatus(status, t("put_failed", error.message), "bad");
      }
      if (state === "done") return;
      if (response.ok || response.status === 412) {
        state = "sent";
        enable(false);
        setStatus(status, response.ok ? waiting : t("already_answered"));
        return fastPoll(Math.min(Date.now() + RESULT_WAIT, expiresAt));
      }
      if (response.status === 403) return finish(t("expired"), "bad");
      state = "idle";
      enable(Date.now() < expiresAt);
      setStatus(status, t("put_failed", "HTTP " + response.status), "bad");
    };

    approveButton.addEventListener("click", async () => {
      if (state !== "idle") return;
      state = "asking";
      enable(false);
      setStatus(status, t("waiting_passkey"));
      let credential;
      try {
        credential = await navigator.credentials.get({
          publicKey: {
            challenge,
            rpId: location.hostname,
            allowCredentials: allow,
            userVerification: "required",
            timeout: Math.max(1000, expiresAt - Date.now()),
          },
        });
      } catch (error) {
        if (state !== "asking") return;
        state = "idle";
        enable(Date.now() < expiresAt);
        return setStatus(status, t("passkey_failed", error.name), "bad");
      }
      if (state !== "asking") return;
      const response = credential.response;
      await answer(JSON.stringify({
        credential_id: bytesToBase64url(credential.rawId),
        client_data_json: bytesToBase64url(response.clientDataJSON),
        authenticator_data: bytesToBase64url(response.authenticatorData),
        signature: bytesToBase64url(response.signature),
      }), t("sent"));
    });
    // "Approve with Touch ID": the helper watches the touch object and shows its dialog (DR-0004).
    if (touchButton) {
      touchButton.addEventListener("click", async () => {
        if (state !== "idle" || touchSending) return;
        touchSending = true;
        touchButton.disabled = true;
        let text;
        let tone;
        try {
          const response = await put(touchUrl, "touch");
          // 412: a request is already in the store (write-once); it counts as asked.
          if (response.ok || response.status === 412) text = t("touch_sent");
          else [text, tone] = [t("touch_failed", "HTTP " + response.status), "bad"];
        } catch (error) {
          [text, tone] = [t("touch_failed", error.message), "bad"];
        }
        touchSending = false;
        if (state !== "idle") return;
        touchButton.disabled = Date.now() >= expiresAt;
        setStatus(status, text, tone);
      });
    }
    // A refusal is unsigned content in the assertion's place (DR-0006).
    rejectButton.addEventListener("click", async () => {
      if (state !== "idle") return;
      state = "asking";
      enable(false);
      await answer(JSON.stringify({ rejected: true }), t("rejecting"));
    });

    const remaining = countdown(new Date(String(details.time)).getTime(), expiresAt, () => {
      if (state === "idle" || state === "asking") finish(t("expired"), "bad");
    });
    app.replaceChildren(
      element("p", "product", t("title")),
      element("h1", null, t("approve_title")),
      element("p", "lead", ...sentence("approve_lead", shown(details.host, 80), shown(details.user, 60))),
      facts([
        [t("host"), shown(details.host, 120)],
        [t("auth_user"), shown(details.user, 80)],
        [t("caller_uid"), shown(details.caller_uid)],
        [t("tty"), shown(details.tty)],
        [t("time"), localTime(details.time)],
        [t("expires"), localTime(request.expires)],
        [t("left"), remaining],
      ]),
      element("h2", null, t("argv")),
      argvList(details.argv),
      element("h2", null, t("chain")),
      chain(details.processes),
      element("div", touchButton ? "actions pair" : "actions", ...(touchButton ? [touchButton] : []), approveButton, rejectButton),
      status,
    );
    slowPoll();
  }

  // The registration code (DR-0011 登録コード): XXXX-XXXX in Crockford's base32 upper case.
  const REGISTRATION_CODE = /^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$/;

  // The registration payload (exchange-format 登録ペイロード). Every key is required: a payload
  // without what the screen shows (an older pam-passkey add) is not one this page can show.
  function register(payload, challenge) {
    const putUrl = httpsUrl(payload.credential_put_url);
    const userId = base64urlToBytes(payload.user_id);
    const createdAt = new Date(String(payload.time)).getTime();
    const expiresAt = new Date(String(payload.expires)).getTime();
    const texts = ["rp_id", "host", "user", "label"].every((key) => typeof payload[key] === "string");
    const ids = [payload.uid, payload.gid].every((id) => Number.isInteger(id) && id >= 0);
    const code = typeof payload.code === "string" && REGISTRATION_CODE.test(payload.code);
    if (!texts || !ids || !code || Number.isNaN(createdAt) || Number.isNaN(expiresAt)) throw new Error("payload");
    const account = stored(payload.user) + "@" + stored(payload.host);
    const status = statusLine();
    const button = element("button", "primary", t("register"));
    const rejectButton = element("button", "danger", t("reject"));
    let busy = false;
    const enable = (on) => {
      button.disabled = !on;
      rejectButton.disabled = !on;
    };
    const remaining = countdown(createdAt, expiresAt, () => {
      if (!busy) {
        enable(false);
        setStatus(status, t("expired"), "bad");
      }
    });
    // A refusal is unsigned content in the credential's place; add ends at once (DR-0011).
    rejectButton.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      enable(false);
      setStatus(status, t("sending"));
      try {
        const response = await put(putUrl, JSON.stringify({ rejected: true }));
        if (response.ok) return setStatus(status, t("rejected_register"));
        if (response.status === 412) return setStatus(status, t("already_answered_register"));
        busy = false;
        enable(Date.now() < expiresAt);
        setStatus(status, response.status === 403 ? t("expired") : t("put_failed", "HTTP " + response.status), "bad");
      } catch (error) {
        busy = false;
        enable(Date.now() < expiresAt);
        setStatus(status, t("put_failed", error.message), "bad");
      }
    });
    button.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      enable(false);
      setStatus(status, t("waiting_passkey"));
      let credential;
      try {
        credential = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { id: payload.rp_id, name: "pam-passkey" },
            // DR-0011: which Mac and which label the passkey is for, in the password manager's
            // list and the passkey chooser.
            user: { id: userId, name: account, displayName: stored(payload.label) + " (" + account + ")" },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }],
            attestation: "none",
            authenticatorSelection: { residentKey: "required", requireResidentKey: true, userVerification: "required" },
            timeout: Math.max(1000, expiresAt - Date.now()),
          },
        });
      } catch (error) {
        busy = false;
        enable(Date.now() < expiresAt);
        return setStatus(status, t("passkey_failed", error.name), "bad");
      }
      setStatus(status, t("sending"));
      try {
        const response = await put(putUrl, JSON.stringify({
          credential_id: bytesToBase64url(credential.rawId),
          client_data_json: bytesToBase64url(credential.response.clientDataJSON),
          attestation_object: bytesToBase64url(credential.response.attestationObject),
        }));
        if (response.ok) return setStatus(status, t("registered"), "ok");
        setStatus(status, response.status === 403 ? t("expired") : t("put_failed", "HTTP " + response.status), "bad");
      } catch (error) {
        setStatus(status, t("put_failed", error.message), "bad");
      }
    });
    app.replaceChildren(
      element("p", "product", t("title")),
      element("h1", null, t("register_title")),
      element("p", "lead", t("register_lead")),
      // The same headings and values as the identity check of pam-passkey add (DR-0004), whose
      // code the user compares with the one shown here.
      facts([
        [t("register_host"), shown(payload.host, 120)],
        [t("register_user"), element("span", null, shown(payload.user, 80), " ", shown(t("ids", payload.uid, payload.gid)))],
        [t("register_label"), shown(payload.label, 120)],
        [t("register_code"), element("span", null, shown(payload.code), element("span", "note", t("register_code_check")))],
        [t("register_url"), shown(payload.rp_id, 120)],
        [t("created"), localTime(payload.time)],
        [t("register_expires"), localTime(payload.expires)],
        [t("register_left"), remaining],
      ]),
      element("div", "actions", button, rejectButton),
      status,
    );
  }

  function message(text, tone) {
    const line = element("p", tone || null, text);
    app.replaceChildren(element("h1", null, t("title")), line);
  }

  async function main() {
    const fragment = location.hash.slice(1);
    if (!fragment) {
      const link = element("a", null, t("project"));
      link.href = "https://github.com/kawaz/pam-passkey";
      link.rel = "noreferrer";
      app.replaceChildren(element("h1", null, t("title")), element("p", null, t("intro")), element("p", null, link));
      return;
    }
    // pam-passkey marks the URL it opens on the Mac itself (local); the rest names the
    // envelope and the key that opens it. Nothing is shown or signed unless all of it holds.
    let link;
    try {
      link = readLink(fragment);
    } catch {
      return message(t("bad_url"), "bad");
    }
    message(t("loading"));
    let bytes;
    try {
      const response = await fetch(link.url, fetchOptions);
      if (!response.ok) return message(t("gone", response.status), "bad");
      bytes = new Uint8Array(await response.arrayBuffer());
    } catch (error) {
      return message(t("fetch_failed", error.message), "bad");
    }
    let payload;
    try {
      if (bytes.length > MAX_PAYLOAD) throw new Error("too large");
      payload = await openEnvelope(bytes, link.key);
    } catch {
      return message(t("bad_request"), "bad");
    } finally {
      link.key.fill(0);
    }
    // The challenge is the SHA-256 of exactly the envelope that was opened and shown (DR-0006).
    const challenge = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
    try {
      if (payload.kind === "approve") return approve(payload, challenge, link.local);
      return register(payload, challenge);
    } catch {
      message(t("bad_request"), "bad");
    }
  }

  window.addEventListener("hashchange", () => location.reload());
  main();
})();
</script>
</body>
</html>
